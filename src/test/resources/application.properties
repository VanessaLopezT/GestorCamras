# Configuración para usar H2 en memoria durante los tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Deshabilitar devtools
spring.devtools.restart.enabled=false

# Override de caché para no usar Redis en tests
spring.cache.type=none

# Configuración de Redis mínima para evitar errores si intenta inicializar beans de Jedis
spring.data.redis.host=localhost
spring.data.redis.port=6379
